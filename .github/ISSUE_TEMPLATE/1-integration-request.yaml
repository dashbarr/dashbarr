name: 🔌 Integration Request
description: Request support for a new integration
title: "feat(integrations): "
labels: ["feature", "integration", "triage"]
projects: ["dashbarr/1"]
type: feature
assignees:
  - "inman-sebastian"
body:
  - type: markdown
    attributes:
      value: |
        ### Want to see a new integration added to Dashbarr? We'd love to hear about it!
        Please fill out the following information and we'll get back to you as soon as possible.
        Thanks for taking the time to fill out this request! 💖
  - type: input
    id: website
    attributes:
      label: "Integration Website"
      description: "The official website of the integration you want added to Dashbarr"
      placeholder: "ex. https://example.com"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Integration Description"
      description: "A short description of the integration you want added to Dashbarr"
      placeholder: "A description of the integration."
    validations:
      required: true
  - type: textarea
    id: additional-information
    attributes:
      label: "Additional Information"
      description: "Any additional information about the integration you want added to Dashbarr"
